name: zizmor

# Static analysis for the workflows themselves: flags unpinned actions,
# template injection, dangerous triggers, and over-broad permissions before
# they merge. zizmor is the de-facto GitHub Actions security linter.

on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Lint workflows
        run: uvx zizmor --min-severity medium .github/workflows/
